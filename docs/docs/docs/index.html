<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Something Beautiful 🌷</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;

            font-family: Georgia, serif;
            color: white;

            background:
                radial-gradient(
                    circle at 50% 50%,
                    #34425f 0%,
                    #1b263e 43%,
                    #080b13 100%
                );
        }


        /* =========================================
           INTRO SCREEN
        ========================================= */

        #intro {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 90%;

            text-align: center;

            z-index: 100;

            transition: opacity 1s ease;
        }


        #intro h1 {
            margin: 0 0 12px;

            font-size: 34px;

            font-weight: normal;

            letter-spacing: 1px;
        }


        #intro p {
            margin: 0 0 30px;

            font-family: Arial, sans-serif;

            font-size: 15px;

            opacity: 0.7;
        }


        /* =========================================
           BUTTON
        ========================================= */

        button {
            border: none;

            padding: 15px 35px;

            border-radius: 40px;

            background: #f3a6c8;

            color: white;

            font-size: 17px;

            cursor: pointer;

            transition: 0.3s ease;

            box-shadow:
                0 0 25px rgba(243, 166, 200, 0.25);
        }


        button:hover {
            transform: scale(1.08);

            box-shadow:
                0 0 35px rgba(243, 166, 200, 0.5);
        }


        /* =========================================
           MAIN SCENE
        ========================================= */

        #scene {
            position: absolute;

            inset: 0;

            display: none;
        }


        /* =========================================
           MAIN MESSAGE
           CLOSE ABOVE THE FLOWER
        ========================================= */

        #message {

            position: absolute;

            top: 32vh;
            left: 7%;

            width: 50%;
            max-width: 570px;

            text-align: left;

            opacity: 0;

            transform: translateY(15px);

            animation:
                messageAppear 1.6s ease forwards;

            animation-delay: 9.8s;

            z-index: 50;
        }


        #message h2 {

            margin: 0;

            font-family: Georgia, serif;

            font-size: clamp(23px, 3vw, 32px);

            font-weight: normal;

            line-height: 1.25;

            letter-spacing: 0.2px;

            color: #ffd8e8;

            text-shadow:
                0 0 12px rgba(255, 170, 210, 0.35);
        }


        /* =========================================
           SIGNATURE
        ========================================= */

        #signature {

            margin-top: 10px;

            font-family: "Brush Script MT",
                         "Segoe Script",
                         cursive;

            font-size: 18px;

            color: #f8c9dc;

            opacity: 0.8;

            letter-spacing: 0.5px;
        }


        @keyframes messageAppear {

            from {
                opacity: 0;

                transform:
                    translateY(15px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =========================================
           BIBLE VERSE
           AT THE VERY BOTTOM
        ========================================= */

        #verse {

            position: absolute;

            left: 50%;

            bottom: 6vh;

            transform:
                translateX(-50%)
                translateY(20px);

            width: 85%;
            max-width: 750px;

            text-align: center;

            opacity: 0;

            animation:
                verseAppear 1.6s ease forwards;

            animation-delay: 11.3s;

            z-index: 50;
        }


        #verse p {

            margin: 0;

            font-family: Georgia, serif;

            font-size: clamp(13px, 1.7vw, 17px);

            line-height: 1.55;

            color: #eeeeee;

            font-style: italic;

            text-shadow:
                0 1px 8px rgba(0,0,0,0.4);
        }


        #verse span {

            display: block;

            margin-top: 7px;

            font-family: Arial, sans-serif;

            font-size: 12px;

            letter-spacing: 0.5px;

            opacity: 0.65;
        }


        @keyframes verseAppear {

            from {
                opacity: 0;

                transform:
                    translateX(-50%)
                    translateY(20px);
            }

            to {
                opacity: 1;

                transform:
                    translateX(-50%)
                    translateY(0);
            }
        }


        /* =========================================
           FLOWER AREA
        ========================================= */

        #flowerScene {

            position: absolute;

            left: 50%;
            bottom: 4vh;

            transform: translateX(-50%);

            width: 320px;
            height: 430px;

            z-index: 10;
        }


        /* =========================================
           GLOW
        ========================================= */

        .flower-glow {

            position: absolute;

            width: 240px;
            height: 240px;

            left: 40px;
            top: -10px;

            border-radius: 50%;

            background: #ffb4d5;

            filter: blur(60px);

            opacity: 0;

            animation:
                glowAppear 2.5s ease forwards;

            animation-delay: 8s;

            z-index: 1;
        }


        @keyframes glowAppear {

            from {
                opacity: 0;

                transform: scale(0.5);
            }

            to {
                opacity: 0.4;

                transform: scale(1.15);
            }
        }


        /* =========================================
           GROUND
        ========================================= */

        .ground {

            position: absolute;

            bottom: 0;
            left: 50%;

            transform: translateX(-50%);

            width: 165px;
            height: 18px;

            background: #3b3027;

            border-radius: 50%;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.45);
        }


        /* =========================================
           STEM
        ========================================= */

        .stem {

            position: absolute;

            left: 50%;
            bottom: 10px;

            transform: translateX(-50%);

            width: 8px;
            height: 0;

            border-radius: 10px;

            background:
                linear-gradient(
                    to right,
                    #28613a,
                    #69cc78,
                    #28613a
                );

            transform-origin: bottom;

            animation:
                stemGrow 4s ease-out forwards;

            animation-delay: 0.7s;

            z-index: 5;
        }


        @keyframes stemGrow {

            from {
                height: 0;
            }

            to {
                height: 245px;
            }
        }


        /* =========================================
           LEAVES
           SAME SIZE / MIRRORED POSITION
        ========================================= */

        .leaf {

            position: absolute;

            width: 72px;
            height: 36px;

            opacity: 0;

            background:
                linear-gradient(
                    135deg,
                    #73d786,
                    #347e4b
                );

            border-radius:
                100% 0 100% 0;

            z-index: 6;
        }


        /* LEFT LEAF */

        .leaf-left {

            left: 146px;
            bottom: 100px;

            transform:
                rotate(-30deg)
                scale(0);

            transform-origin: right center;

            animation:
                leafLeftGrow 1.3s ease-out forwards;

            animation-delay: 3.7s;
        }


        @keyframes leafLeftGrow {

            from {
                opacity: 0;

                transform:
                    rotate(-32deg)
                    scale(0);
            }

            to {
                opacity: 1;

                transform:
                    rotate(-32deg)
                    scale(1);
            }
        }


        /* RIGHT LEAF */

        .leaf-right {

            left: 160px;
            bottom: 105px;

            transform:
                rotate(32deg)
                scaleX(-1)
                scale(0);

            transform-origin: left center;

            animation:
                leafRightGrow 1.3s ease-out forwards;

            animation-delay: 4.3s;
        }


        @keyframes leafRightGrow {

            from {
                opacity: 0;

                transform:
                    rotate(32deg)
                    scaleX(-1)
                    scale(0);
            }

            to {
                opacity: 1;

                transform:
                    rotate(32deg)
                    scaleX(-1)
                    scale(1);
            }
        }


        /* =========================================
           FLOWER
        ========================================= */

        .flower {

            position: absolute;

            width: 150px;
            height: 150px;

            left: 85px;
            top: 20px;

            opacity: 0;

            transform:
                translateY(35px)
                scale(0.05);

            animation:
                budAppear 1.5s ease-out forwards,
                flowerBloom 1.7s cubic-bezier(.2,1.4,.4,1) forwards;

            animation-delay:
                5.2s,
                7.1s;

            z-index: 10;
        }


        @keyframes budAppear {

            from {
                opacity: 0;

                transform:
                    translateY(35px)
                    scale(0.03);
            }

            to {
                opacity: 1;

                transform:
                    translateY(35px)
                    scale(0.23);
            }
        }


        @keyframes flowerBloom {

            0% {
                transform:
                    translateY(35px)
                    scale(0.23);
            }

            65% {
                transform:
                    translateY(35px)
                    scale(1.12);
            }

            100% {
                transform:
                    translateY(35px)
                    scale(1);
            }
        }


        /* =========================================
           FOUR MAIN PETALS
        ========================================= */

        .petal {

            position: absolute;

            width: 72px;
            height: 72px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 28%,
                    #ffe9f1 0%,
                    #f7aac7 55%,
                    #dc719e 100%
                );

            box-shadow:
                inset -4px -5px 9px rgba(0,0,0,0.08);
        }


        .petal1 {
            top: 0;
            left: 39px;
        }


        .petal2 {
            top: 39px;
            left: 0;
        }


        .petal3 {
            top: 39px;
            right: 0;
        }


        .petal4 {
            bottom: 0;
            left: 39px;
        }


        /* =========================================
           EXTRA SMALL PETALS
           AT THE INTERSECTION
        ========================================= */

        .mini-petal {

            position: absolute;

            width: 29px;
            height: 29px;

            border-radius: 50% 50% 45% 45%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #fff0b5,
                    #f8c66c 45%,
                    #ed8cae 100%
                );

            z-index: 11;

            box-shadow:
                0 0 7px rgba(255, 214, 125, 0.45);
        }


        .mini1 {

            top: 37px;
            left: 60px;

            transform:
                rotate(-45deg)
                scale(0);

            animation:
                miniBloom 1s ease-out forwards;

            animation-delay: 7.8s;
        }


        .mini2 {

            top: 60px;
            left: 83px;

            transform:
                rotate(45deg)
                scale(0);

            animation:
                miniBloom 1s ease-out forwards;

            animation-delay: 7.9s;
        }


        .mini3 {

            top: 83px;
            left: 60px;

            transform:
                rotate(135deg)
                scale(0);

            animation:
                miniBloom 1s ease-out forwards;

            animation-delay: 8s;
        }


        .mini4 {

            top: 60px;
            left: 37px;

            transform:
                rotate(-135deg)
                scale(0);

            animation:
                miniBloom 1s ease-out forwards;

            animation-delay: 8.1s;
        }


        @keyframes miniBloom {

            0% {
                transform:
                    scale(0)
                    rotate(0deg);

                opacity: 0;
            }

            70% {
                transform:
                    scale(1.15)
                    rotate(10deg);

                opacity: 1;
            }

            100% {
                transform:
                    scale(1)
                    rotate(0deg);

                opacity: 1;
            }
        }


        /* =========================================
           YELLOW CENTER
        ========================================= */

        .center {

            position: absolute;

            width: 47px;
            height: 47px;

            left: 51px;
            top: 51px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    #fff8b0 0%,
                    #ffd84e 55%,
                    #e6a928 100%
                );

            z-index: 15;

            box-shadow:
                0 0 18px rgba(255,220,90,0.7);
        }


        /* =========================================
           CENTER DETAILS
        ========================================= */

        .center::before {

            content: "";

            position: absolute;

            inset: 10px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    #fff7a8,
                    #f4c536
                );

            opacity: 0.7;
        }


        /* =========================================
           FLOATING PARTICLES
        ========================================= */

        .particle {

            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #ffe1ed;

            opacity: 0;

            animation:
                floatParticle 4s ease-in-out infinite;

            z-index: 20;
        }


        .p1 {
            left: 42px;
            bottom: 170px;
            animation-delay: 8s;
        }


        .p2 {
            right: 40px;
            bottom: 185px;
            animation-delay: 8.7s;
        }


        .p3 {
            left: 25px;
            bottom: 235px;
            animation-delay: 9.3s;
        }


        .p4 {
            right: 25px;
            bottom: 245px;
            animation-delay: 10s;
        }


        .p5 {
            left: 150px;
            bottom: 285px;
            animation-delay: 9s;
        }


        @keyframes floatParticle {

            0% {
                opacity: 0;

                transform:
                    translateY(20px)
                    scale(0);
            }

            30% {
                opacity: 1;
            }

            70% {
                opacity: 1;
            }

            100% {
                opacity: 0;

                transform:
                    translateY(-90px)
                    scale(1.4);
            }
        }


        /* =========================================
           AGAIN BUTTON
        ========================================= */

        #restart {

            position: absolute;

            right: 25px;
            bottom: 20px;

            display: none;

            padding: 10px 18px;

            font-size: 13px;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid rgba(255,255,255,0.2);

            z-index: 100;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            #message {

                top: 31vh;

                left: 7%;

                width: 86%;
            }


            #message h2 {
                font-size: 23px;
            }


            #signature {
                font-size: 16px;
            }


            #verse {

                bottom: 5vh;

                width: 88%;
            }


            #verse p {
                font-size: 13px;
            }


            #flowerScene {

                bottom: 8vh;

                transform:
                    translateX(-50%)
                    scale(0.76);
            }


            #restart {

                right: 15px;
                bottom: 15px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         INTRO
    ========================================= -->

    <div id="intro">

        <h1>A little reminder 🌱</h1>

        <p>
            Some things are worth waiting for...
        </p>

        <button onclick="startGrowing()">
            Click Me 🌷
        </button>

    </div>



    <!-- =========================================
         MAIN SCENE
    ========================================= -->

    <div id="scene">


        <!-- =====================================
             MESSAGE ABOVE FLOWER
        ====================================== -->

        <div id="message">

            <h2>
                Something beautiful takes time. 🌷
            </h2>

            <div id="signature">
                — nesi mwuah ♡
            </div>

        </div>



        <!-- =====================================
             FLOWER
        ====================================== -->

        <div id="flowerScene">

            <div class="flower-glow"></div>

            <div class="ground"></div>

            <div class="stem"></div>


            <!-- LEFT LEAF -->

            <div class="leaf leaf-left"></div>


            <!-- RIGHT LEAF -->

            <div class="leaf leaf-right"></div>



            <!-- FLOWER -->

            <div class="flower">


                <!-- FOUR MAIN PETALS -->

                <div class="petal petal1"></div>

                <div class="petal petal2"></div>

                <div class="petal petal3"></div>

                <div class="petal petal4"></div>



                <!-- CENTER -->

                <div class="center"></div>

            </div>



            <!-- FLOATING LIGHTS -->

            <div class="particle p1"></div>

            <div class="particle p2"></div>

            <div class="particle p3"></div>

            <div class="particle p4"></div>

            <div class="particle p5"></div>

        </div>



        <!-- =====================================
             BIBLE VERSE AT BOTTOM
        ====================================== -->

        <div id="verse">

            <p>
                “For everything there is a season,
                and a time for every matter under heaven.”
            </p>

            <span>
                — Ecclesiastes 3:1
            </span>

        </div>


    </div>



    <!-- =========================================
         AGAIN BUTTON
    ========================================= -->

    <button
        id="restart"
        onclick="location.reload()"
    >
        ↻ Again
    </button>



    <script>

        function startGrowing() {

            const intro =
                document.getElementById("intro");

            const scene =
                document.getElementById("scene");


            /* Fade out intro */

            intro.style.opacity = "0";


            /* Start animation */

            setTimeout(function () {

                intro.style.display = "none";

                scene.style.display = "block";

            }, 900);


            /* Show Again button */

            setTimeout(function () {

                document.getElementById("restart")
                    .style.display = "block";

            }, 12500);

        }

    </script>


</body>

</html>
